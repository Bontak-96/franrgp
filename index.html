<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Подключиться к серверу GMod</title>
<style>
  :root {
    --bg: #1e1f24;
    --card-bg: #2b2d33;
    --text: #f2f2f2;
    --muted: #a0a3ab;
    --accent: #5865F2;
    --accent-hover: #4752c4;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f5f7;
      --card-bg: #ffffff;
      --text: #1e1f24;
      --muted: #5b5e66;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 40px 32px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .icon {
    font-size: 48px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 8px;
  }
  p.ip {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 28px;
    word-break: break-all;
  }
  a.btn {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    padding: 14px 28px;
    border-radius: 10px;
    transition: background 0.15s ease;
    width: 100%;
  }
  a.btn:hover {
    background: var(--accent-hover);
  }
  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: var(--muted);
  }
  code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🎮</div>
    <h1>Подключение к серверу GMod...</h1>
    <p class="ip">188.239.111.135:26969</p>
    <a class="btn" href="steam://connect/188.239.111.135:26969">Подключиться через Steam</a>
    <p class="hint">Если переход не начался автоматически, нажмите кнопку выше или скопируйте: <code>steam://connect/188.239.111.135:26969</code></p>
  </div>
  <script>
    window.location.href = "steam://connect/188.239.111.135:26969";
  </script>
</body>
</html>
